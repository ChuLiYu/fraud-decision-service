# Training and evaluation component (scope phase 1).
# Versions checked on 2026-11-05: Python 3.14 is the newest release line
# with macOS arm64 wheels for every dependency (PyYAML has no 3.15 wheels yet).
# Exact versions are pinned in uv.lock.
[project]
name = "fraud-ml"
version = "0.1.0"
description = "Data pipeline, training, and evaluation for the fraud decision course project"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=3.1.1,<3.2",
    "pyarrow>=26.0.1,<27",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
# Only needed to download data; kept separate because it pulls many packages.
# kaggle 2.2.5 imports `six` without declaring it, so it is listed here.
fetch = ["kaggle>=2.2.5,<3", "six>=1.17.0,<2"]

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.4,<0.18",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# D: docstrings are required in src/ (course rubric asks for thoroughly commented code; ADR-004).
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
