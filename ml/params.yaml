# Tunable parameters for the pipeline. This file is the single source of truth
# for values; docs/ml/tuning-guide.md explains what each one does.
# Changing any value changes the params hash recorded in the manifest, so
# training will refuse artifacts produced with different settings.

data:
  raw_dir: ../data/raw              # where fetch puts the Kaggle CSVs
  processed_dir: ../data/processed  # where prepare writes its artifacts
  models_dir: ../data/models        # trained models; local only (dataset card)
  reports_dir: reports              # aggregate metrics; committed

split:
  # Consecutive TransactionDT ranges. Fractions are of rows, but each cut is
  # moved to a TransactionDT boundary so no timestamp spans two splits.
  train_fraction: 0.70
  valid_fraction: 0.15              # test gets the remainder

preprocess:
  # A category value seen fewer times than this in the training range is
  # treated as unknown (code -1), so rare values cannot be memorized.
  min_category_count: 10

seed: 42                            # fixes randomness in model training

baseline:
  # Logistic regression on median-imputed, standardized numeric features plus
  # one-hot categories. A simple reference the main model must beat.
  C: 1.0                            # inverse regularization strength
  max_iter: 500

lightgbm:
  learning_rate: 0.05
  num_leaves: 63                    # tree complexity
  min_child_samples: 100            # minimum rows per leaf
  feature_fraction: 0.5             # share of features sampled per tree
  bagging_fraction: 0.8             # share of rows sampled per iteration
  bagging_freq: 1
  lambda_l2: 1.0
  max_rounds: 3000                  # upper bound; early stopping picks the count
  early_stopping_rounds: 100        # stop when validation PR-AUC stops improving

evaluation:
  review_rates: [0.005, 0.01, 0.02, 0.05]  # share of transactions sent to review
  calibration_bins: 10
  time_slices: 4                    # equal-row slices of the evaluated range, in time order
