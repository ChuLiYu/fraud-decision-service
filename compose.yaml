# One command: docker compose up --build
# Serves the demo model (synthetic data). For the real model, build it with
# `make -C ml serve-model` and add -f compose.real.yaml.
#
# Decision events (ADR-006): the service writes decisions and outbox rows to
# Postgres in one transaction; Debezium (Kafka Connect) reads the outbox from
# the WAL and publishes to Kafka topic fraud.decision-events; the consumer
# counts outcomes per model, deduplicating by event_id.
# Images checked on 2026-11-15: postgres 18.7 (Debezium 3.7 supports 14-18),
# apache/kafka 4.4.0 (KRaft), debezium/connect 3.7.1.Final.
# Local demo credentials only; not used anywhere else.
x-db: &db
  DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
services:
  postgres:
    image: postgres:18.7-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 2s
      retries: 30
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: fraud-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/ >/dev/null"]
      interval: 5s
      retries: 40
  connect-init:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on:
      connect: {condition: service_healthy}
      decision: {condition: service_healthy}  # outbox table exists before the snapshot
    entrypoint: ["/bin/bash", "/config/register.sh"]
    volumes:
      - ./deploy/connect:/config:ro
    restart: "no"
  decision:
    build: .
    image: fraud-decision-service:local
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *db
    ports:
      - "8000:8000"
  consumer:
    build: .
    image: fraud-decision-service:local
    depends_on:
      kafka: {condition: service_healthy}
      decision: {condition: service_healthy}
    environment:
      <<: *db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "-m", "fraud_service.consumer"]
    healthcheck:
      disable: true  # the image's HTTP check is for the decision API
    restart: on-failure
volumes:
  pgdata:
